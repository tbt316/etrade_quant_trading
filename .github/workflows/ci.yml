# Required PR gate: deterministic offline tests only.
name: ci

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.20'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/build.lock
            requirements/runtime.lock
            requirements/test.lock

      - name: Enforce repository hygiene
        working-directory: etrade_python_client
        run: python scripts/check_repo_hygiene.py

      - name: Install hash-locked build tools
        run: |
          python -m pip install \
            --require-hashes \
            --only-binary=:all: \
            -r requirements/build.lock

      - name: Install hash-locked test environment
        run: |
          python -m pip install \
            --require-hashes \
            --no-build-isolation \
            --only-binary=:all: \
            --no-binary=pyetrade,rauth \
            -r requirements/test.lock
          python -m pip install --no-deps --no-build-isolation .
          python -m pip check
          
      - name: Enforce E*TRADE mutation boundary
        working-directory: etrade_python_client
        run: python scripts/check_etrade_mutation_boundary.py

      - name: Run deterministic tests
        working-directory: etrade_python_client
        env:
          PYTHONPATH: .
        run: pytest -q tests
