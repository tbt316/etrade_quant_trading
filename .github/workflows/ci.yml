# Required PR gate: deterministic offline tests only.
name: ci

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LC_ALL: C.UTF-8
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_NO_INPUT: '1'
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      TZ: UTC
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.10.20'

      - name: Set isolated paths and reproducible build timestamp
        run: |
          install -d -m 700 \
            "$RUNNER_TEMP/cache" \
            "$RUNNER_TEMP/matplotlib"
          echo "MPLCONFIGDIR=$RUNNER_TEMP/matplotlib" >> "$GITHUB_ENV"
          echo "XDG_CACHE_HOME=$RUNNER_TEMP/cache" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Enforce repository hygiene
        working-directory: etrade_python_client
        run: python scripts/check_repo_hygiene.py

      - name: Install hash-locked build tools
        run: |
          python -m pip install \
            --require-hashes \
            --only-binary=:all: \
            -r requirements/build.lock

      - name: Install hash-locked test environment
        run: |
          python -m pip install \
            --require-hashes \
            --no-build-isolation \
            --only-binary=:all: \
            --no-binary=pyetrade,rauth \
            -r requirements/test.lock

      - name: Enforce E*TRADE mutation boundary
        working-directory: etrade_python_client
        run: python scripts/check_etrade_mutation_boundary.py

      - name: Test repository policy contracts
        working-directory: etrade_python_client
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q -m "not integration" \
            tests/test_etrade_mutation_boundary.py \
            tests/test_repo_hygiene.py

      - name: Build release artifacts
        run: |
          umask 022
          mkdir -p "$RUNNER_TEMP/release-source-a"
          mkdir -p "$RUNNER_TEMP/release-source-b"
          git archive --format=tar HEAD |
            tar -xf - -C "$RUNNER_TEMP/release-source-a"
          git archive --format=tar HEAD |
            tar -xf - -C "$RUNNER_TEMP/release-source-b"
          python -m build --sdist --wheel --no-isolation \
            --outdir dist "$RUNNER_TEMP/release-source-a"
          python -m build --sdist --wheel --no-isolation \
            --outdir reproducible-dist "$RUNNER_TEMP/release-source-b"
          python etrade_python_client/scripts/normalize_sdist.py \
            --sdist dist/*.tar.gz \
            --epoch "$SOURCE_DATE_EPOCH"
          python etrade_python_client/scripts/normalize_sdist.py \
            --sdist reproducible-dist/*.tar.gz \
            --epoch "$SOURCE_DATE_EPOCH"

      - name: Inspect release artifacts
        run: |
          umask 022
          python etrade_python_client/scripts/check_release_artifacts.py \
            --dist-dir dist \
            --repository-root "$GITHUB_WORKSPACE" \
            --git-revision HEAD
          cmp dist/*.whl reproducible-dist/*.whl
          cmp dist/*.tar.gz reproducible-dist/*.tar.gz
          mkdir -p "$RUNNER_TEMP/sdist-source"
          mkdir -p "$RUNNER_TEMP/sdist-dist"
          tar -xzf dist/*.tar.gz \
            --strip-components=1 \
            -C "$RUNNER_TEMP/sdist-source"
          python -m build --wheel --no-isolation \
            --outdir "$RUNNER_TEMP/sdist-dist" \
            "$RUNNER_TEMP/sdist-source"
          cmp dist/*.whl "$RUNNER_TEMP/sdist-dist"/*.whl

      - name: Install and verify wheel
        run: |
          python -m pip install --no-deps --no-build-isolation dist/*.whl
          python -m pip check

      - name: Verify clean runtime environment
        run: |
          python -m venv "$RUNNER_TEMP/runtime-venv"
          "$RUNNER_TEMP/runtime-venv/bin/python" -m pip install \
            --require-hashes \
            --only-binary=:all: \
            -r requirements/build.lock
          "$RUNNER_TEMP/runtime-venv/bin/python" -m pip install \
            --require-hashes \
            --no-build-isolation \
            --only-binary=:all: \
            --no-binary=pyetrade,rauth \
            -r requirements/runtime.lock
          "$RUNNER_TEMP/runtime-venv/bin/python" -m pip install \
            --no-deps \
            --no-build-isolation \
            dist/*.whl
          "$RUNNER_TEMP/runtime-venv/bin/python" -m pip check
          "$RUNNER_TEMP/runtime-venv/bin/python" -m pip uninstall \
            --yes \
            pip \
            poetry-core \
            setuptools \
            wheel

      - name: Test release artifacts without network
        env:
          ETRADE_TEST_ARTIFACT: '1'
          ETRADE_TEST_NETWORK: deny
          ETRADE_TEST_NETWORK_NAMESPACE: '1'
        run: |
          install -d -m 700 \
            "$RUNNER_TEMP/offline-home" \
            "$RUNNER_TEMP/offline-temp" \
            "$RUNNER_TEMP/runtime-smoke"
          sudo unshare --net -- bash -c '
              ip link set lo up
              exec setpriv \
                --reuid="$SUDO_UID" \
                --regid="$SUDO_GID" \
                --clear-groups \
                --no-new-privs \
                env -u PYTHONPATH \
                HOME="$2" \
                USER="$SUDO_USER" \
                LOGNAME="$SUDO_USER" \
                "$1" "$3" \
                  --runtime-python "$4" \
                  --runtime-smoke "$5" \
                  --runtime-work-dir "$6" \
                  --offline-home "$2" \
                  --offline-temp "$7" \
                  --repository-root "$8"
            ' artifact-test \
              "$(command -v python)" \
              "$RUNNER_TEMP/offline-home" \
              "$GITHUB_WORKSPACE/etrade_python_client/scripts/run_offline_artifact_checks.py" \
              "$RUNNER_TEMP/runtime-venv/bin/python" \
              "$GITHUB_WORKSPACE/etrade_python_client/scripts/check_installed_runtime.py" \
              "$RUNNER_TEMP/runtime-smoke" \
              "$RUNNER_TEMP/offline-temp" \
              "$GITHUB_WORKSPACE"
