[build-system]
requires = [
    "setuptools==83.0.0",
    "wheel==0.47.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "etrade-quant-trading"
version = "0.1.0"
description = "Causal options research and fail-closed E*TRADE trading infrastructure"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "aiohttp==3.11.11",
    "certifi==2024.12.14",
    "hmmlearn==0.3.3",
    "matplotlib==3.6.3",
    "numpy==1.23.5",
    "pandas==2.3.2",
    "pandas-market-calendars==5.1.0",
    "plotly==6.0.0",
    "pyetrade==2.1.1",
    "pyperclip==1.11.0",
    "python-dateutil==2.9.0.post0",
    "python-dotenv==1.2.1",
    "pytz==2024.1",
    "PyYAML==6.0.3",
    "rauth==0.7.3",
    "requests==2.32.5",
    "scikit-learn==1.7.2",
    "scipy==1.15.3",
    "selenium==4.27.1",
    "statsmodels==0.14.4",
    "tqdm==4.67.1",
    "urllib3==1.26.19",
    "xmltodict==0.13.0",
    "yfinance==0.2.66",
]

[project.optional-dependencies]
analyst = [
    "google-genai==1.73.1",
    "playwright==1.57.0",
]
dev = [
    "build==1.5.0",
    "pip==26.1.2",
    "pip-tools==7.6.0",
    "pytest==8.4.2",
    "setuptools==83.0.0",
    "tomli==2.4.1",
    "typing-extensions==4.16.0",
    "wheel==0.47.0",
]
research = [
    "beautifulsoup4==4.12.3",
    "seaborn==0.13.2",
]
test = [
    "pytest==8.4.2",
]

[tool.setuptools]
package-dir = {"" = "etrade_python_client"}
packages = [
    "accounts",
    "ai_agents",
    "backtesting",
    "core_api",
    "data_and_research",
    "live_trading",
    "market",
    "order",
    "polygonio",
    "strategies",
]
include-package-data = false

[tool.setuptools.package-data]
backtesting = ["strategies/*.yaml"]
live_trading = ["dashboard_template.html", "runtime_config.example.json"]

[tool.pytest.ini_options]
testpaths = ["etrade_python_client/tests"]
addopts = ["--import-mode=importlib"]
markers = [
    "integration: tests that require live external services",
]
